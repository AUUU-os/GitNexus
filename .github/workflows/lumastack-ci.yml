name: LumaStack CI

on:
  push:
    paths:
      - 'lumastack/**'
      - '.github/workflows/lumastack-ci.yml'
  pull_request:
    paths:
      - 'lumastack/**'
      - '.github/workflows/lumastack-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lumastack:
    name: Test LumaStack skeleton
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run LumaStack tests
        run: python -m pytest lumastack/tests -q
